name: Morning Signal daily run

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC = 5:30 PM IST (GitHub often starts a few minutes late)
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python agent/run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://morning-signal-inky.vercel.app/
      - name: Save the new issue
        run: |
          git config user.name "morning-signal-bot"
          git config user.email "morning-signal-bot@users.noreply.github.com"
          git add site/data
          git commit -m "Daily issue $(date -u +%F)" || echo "Nothing new"
          git push
      - name: Notify by email (a GitHub issue that mentions the owner; GitHub emails it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n@%s' "${{ github.repository_owner }}" >> brief.md
          gh issue create --title "$(cat brief_title.txt)" --body-file brief.md
